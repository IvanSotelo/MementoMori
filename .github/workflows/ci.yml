name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        # Nuxt 4.5 + cssnano 8 require Node ^22.19 / ^24.11 (Set.prototype.difference)
        node: [22]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install

      - name: Type check
        run: pnpm run lint:ts

      - name: Build
        run: pnpm run build

      # - name: Run linter 👀
      #   run: pnpm lint:js

      # - name: Run tests 🧪
      #   run: pnpm test
